      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug || buildozer android debug || true
          mkdir -p bin
          ls -la bin || true
        continue-on-error: false

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: .buildozer/android/platform/build-*/**/*.log
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev build-essential ccache libncurses-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Clean old Buildozer cache
        run: |
          rm -rf ~/.buildozer
          sudo rm -rf /var/tmp/pip-*

      - name: Patch pyjnius recipe
        run: |
          RECIPE_DIR=$(find ~/.buildozer -type d -path '*recipes/pyjnius' 2>/dev/null | head -n 1 || true)
          echo "pyjnius recipe dir: $RECIPE_DIR"

      - name: Fix buildozer.spec
        run: |
          sed -i 's/^#* *android.api *=.*/android.api = 31/' buildozer.spec || true
          sed -i 's/^#* *android.minapi *=.*/android.minapi = 24/' buildozer.spec || true
          sed -i 's/^#* *android.archs *=.*/android.archs = arm64-v8a/' buildozer.spec || true

      - name: Use stable debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug || buildozer android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sputnik-apk
          path: bin/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
