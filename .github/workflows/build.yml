name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev build-essential ccache libncurses-dev libltdl-dev

      - name: Downgrade libtool to 2.4.7
        run: |
          wget -q https://ftp.gnu.org/gnu/libtool/libtool-2.4.7.tar.gz
          tar -xzf libtool-2.4.7.tar.gz
          cd libtool-2.4.7
          ./configure --prefix=/usr
          make -j4
          sudo make install
          sudo ldconfig
          libtoolize --version

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Clean old Buildozer cache
        run: |
          rm -rf ~/.buildozer
          sudo rm -rf /var/tmp/pip-*

      - name: Fix buildozer.spec
        run: |
          sed -i 's/^#* *android.api *=.*/android.api = 31/' buildozer.spec || true
          sed -i 's/^#* *android.minapi *=.*/android.minapi = 24/' buildozer.spec || true
          sed -i 's/^#* *android.archs *=.*/android.archs = arm64-v8a/' buildozer.spec || true

      - name: Use stable debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK with Buildozer
        env:
          PIP_PLATFORM: android_24_arm64_v8a
        run: |
          set +e
          yes | buildozer android debug > build_log.txt 2>&1
          tail -n 200 build_log.txt
          grep -n -i -E "error|failed|traceback" build_log.txt | tail -n 50 || true
          REQ=$(find .buildozer -name requirements.txt -path '*build*' 2>/dev/null | head -n 1)
          echo "=== requirements.txt: $REQ ==="
          cat "$REQ" || true
          mkdir -p bin
          ls -la bin || true
          test -f bin/*.apk

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
